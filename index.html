/* Refined finishing pass: softer editorial styling, calmer spacing, and more tactile details. */
:root{
 --bg:#fcf7f3;--paper:#fffdf9;--pink:#f4e5e5;--rose:#c28d98;--dark:#936775;
 --ink:#514247;--muted:#98858a;--line:#eee1dd;--shadow:0 22px 70px rgba(105,73,80,.085)
}
body{letter-spacing:.005em}
.ambient{background:radial-gradient(ellipse at 8% 8%,#fff 0,transparent 35%),radial-gradient(ellipse at 95% 90%,#f0dfe2 0,transparent 34%),#fcf7f3}

.flower{width:48px;height:48px;border-radius:50%;margin:0 auto 13px;display:grid;place-items:center;background:#f8eded;color:#b77d8a}

.field input:focus{border-color:#c99aa3;box-shadow:0 0 0 4px #c28d9817}
.btn{background:linear-gradient(135deg,#bd8793,#a97582);box-shadow:0 8px 20px #a9758220;letter-spacing:.015em}
.btn:hover:not(:disabled){background:linear-gradient(135deg,#ae7784,#925f6d)}
.gate-card{border-radius:30px;padding-top:36px;padding-bottom:36px}
.lock{background:#f8eeee;border:1px solid #f0e1e2;box-shadow:inset 0 1px #fff}

.unit{background:rgba(255,250,248,.9);border-color:#f0e4e1;box-shadow:0 4px 15px #8b62630a}
.unit strong{letter-spacing:-.04em}
.nav{background:rgba(252,247,243,.86);border-bottom-color:#eee3df}
.brand{font-size:1.7rem}
.hero{background:radial-gradient(ellipse at 50% 38%,#fff 0%,#fffaf7 48%,#f8eeee 100%)}
.hero:before,.hero:after{border-color:#e8cfd1}

.hero p{max-width:400px}
.pill{background:#fffdf9;border-color:#ead4d7;box-shadow:0 5px 18px #a9758209}

.photo:hover{transform:translateY(-5px) scale(1.006)}
.photo .placeholder{color:#a67a84}
.photo .placeholder:first-line{font-size:1.2rem}
.letter-section{background:linear-gradient(145deg,#f8eeee,#f7ebea)}
.letter{border-radius:4px 18px 4px 18px;border-color:#e9d9c9;box-shadow:0 22px 55px #73544b12;background-color:#fffaf1}

.letter h3{letter-spacing:-.02em}
.letter p{color:#74666a}

/* Shagun's cream & champagne-gold edition */
:root{
 --bg:#f8f2e6;--paper:#fffaf0;--pink:#f3e5cc;--rose:#b88943;
 --dark:#805b2b;--ink:#49351f;--muted:#927c60;--line:#ead9b9;
 --shadow:0 24px 70px rgba(117,82,34,.12);
}
body{background:#f8f2e6;color:#49351f}
.ambient{background:radial-gradient(circle at 15% 12%,#fffdf5 0,transparent 34%),radial-gradient(circle at 88% 82%,#ead9b655 0,transparent 36%),linear-gradient(135deg,#fbf6eb,#f3ead8)}
.ambient:after{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.115;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
 mix-blend-mode:multiply;
}
.orb{background:#d6b36a33;filter:blur(2px)}
.login-card,.gate-card{background:rgba(255,251,241,.92);border-color:#e8d3a9;box-shadow:0 22px 65px rgba(123,88,37,.13)}
.login-title{color:#79562c}
input,button{accent-color:#b98b43}
.btn{background:linear-gradient(135deg,#d9b56d,#b8893f);border:1px solid #c49a52;color:#fffdf6;box-shadow:0 9px 22px #a57a3b24}
.btn:hover{filter:brightness(1.04);transform:translateY(-2px)}
.date,.pill{background:#fff8e8;border-color:#dfc58f;color:#87632e}
.unit{background:#fffaf0;border:1px solid #ead9b9;box-shadow:0 8px 22px #9d77301a}
.nav{background:rgba(250,245,233,.88);border-color:#eadfc9}
.brand,.head .script,.script{color:#a77c3b}
.hero{background:radial-gradient(ellipse at 50% 38%,#fffdf6 0%,#fbf4e7 55%,#f0e4ce 100%)}
.hero:before,.hero:after{border-color:#d9bf8d}
.hero h1{color:#75532b;text-shadow:0 3px 24px #b88b431b}
.hero h1 em{color:#b58a47}
section{background:transparent}
.head h2,.final h2{color:#604522}
.photo{background:linear-gradient(145deg,#f7edda,#fffaf0);border-color:#e7d4ae;box-shadow:0 12px 28px #85612b12}
.photo:hover{box-shadow:0 16px 34px #85612b20}
.letter{background:linear-gradient(135deg,#fff9e9,#f5e8cf);border-color:#e5d0a6;box-shadow:0 20px 50px #86612a18}
.music{background:#fff9ec;border-color:#e8d5b0}
footer{color:#9c8056}
.duo-art{display:block;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 12px 18px rgba(133,94,42,.10));}
.login-art{width:min(185px,55%);height:125px;margin:0 auto 3px;object-position:center 48%;border-radius:28px}
.hero{isolation:isolate}

@keyframes goldDrift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(18px,-22px,0)}}

/* Birthday carnival: responsive interactive cards */
.carnival-section,.happiness-section{padding-top:74px;padding-bottom:74px}
.carnival-banner{display:flex;align-items:center;gap:16px;padding:19px 22px;margin:0 auto 24px;max-width:800px;border:1px solid #e6d2aa;border-radius:22px;background:linear-gradient(110deg,#fff9e9,#f3e5c9);box-shadow:0 12px 32px #8a68201a}
.carnival-bears{font-size:2.3rem;white-space:nowrap}.carnival-bears span{font-size:1rem;color:#b88943}
.carnival-banner strong,.carnival-banner small{display:block}.carnival-banner strong{font:600 1.08rem "Playfair Display",serif;color:#72502b}.carnival-banner small{font-size:.78rem;color:#927c60;margin-top:4px}
.star-stamp{margin-left:auto;width:55px;height:55px;border:1px solid #caa35c;border-radius:50%;display:grid;place-content:center;text-align:center;color:#a77c3b;font-size:1rem;line-height:1}.star-stamp small{font-size:.48rem;letter-spacing:.1em;margin-top:3px}
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.game-card{min-width:0;position:relative;overflow:hidden;padding:22px;border:1px solid #e9d9ba;border-radius:23px;background:linear-gradient(150deg,#fffdf6,#f8eedb);box-shadow:0 12px 30px #8a682012;transition:transform .25s ease,box-shadow .25s ease}
.game-card:hover{transform:translateY(-3px);box-shadow:0 17px 34px #8a682020}
.game-icon{font-size:1.65rem;margin-bottom:9px}.game-tag{font-size:.55rem;letter-spacing:.18em;color:#ad8748;font-weight:700}
.game-card h3{font:600 1.35rem "Playfair Display",serif;color:#654723;margin:7px 0}.game-card p{font-size:.82rem;line-height:1.6;color:#8b785d;margin:0 0 13px}
.balloon-row{display:flex;justify-content:center;align-items:end;gap:11px;min-height:100px;padding:5px 0}
.balloon{position:relative;width:44px;height:57px;border:0;border-radius:52% 48% 48% 48%;color:#fff;font-size:1.15rem;box-shadow:inset -7px -6px 0 #0000000b,0 5px 10px #8a682019;cursor:pointer;animation:balloonBob 2.4s ease-in-out infinite alternate}
.balloon:after{content:"";position:absolute;left:50%;top:56px;height:24px;border-left:1px solid #b99a67}
.balloon.b1{background:#d9b56d}.balloon.b2{background:#d7a9a1;animation-delay:.3s}.balloon.b3{background:#a9b69a;animation-delay:.6s}.balloon.b4{background:#c9a4bc;animation-delay:.9s}
.balloon.popped{transform:scale(0);opacity:0;pointer-events:none;transition:.25s}
@keyframes balloonBob{to{transform:translateY(-7px) rotate(4deg)}}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
.gift-box{min-height:60px;border:1px solid #e6d2aa;border-radius:14px;background:#fff8e8;font-size:1.8rem;cursor:pointer;transition:transform .2s,background .2s}
.gift-box:active{transform:scale(.92)}.gift-box.opened{background:#f3e4c6;transform:rotate(-4deg)}
.game-result{min-height:34px;margin-top:9px;padding:9px 11px;border-radius:12px;background:#f4e9d5;color:#806139;font-size:.74rem;line-height:1.45;text-align:center}
